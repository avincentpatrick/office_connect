name: office-connect

# Local dev stack. Host-published ports are chosen to coexist with Laragon
# dev_pims (MySQL 3306, php artisan serve 8000, Vite 5173, Redis 6379).
#
# DB roles: oc_dev = owner/migrations (Alembic); oc_app = runtime (no DELETE
# anywhere, no UPDATE on append-only tables) — database-standards.md §8.
# oc_app is created by migration 0001.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oc_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oc_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-office_connect}
    ports:
      - "5432:5432"          # 5432 is free on this machine (no other Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oc_dev} -d ${POSTGRES_DB:-office_connect}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"          # host 6380 -> avoids Laragon's configured Redis (6379)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      # Dev-only convenience: advisory-locked `alembic upgrade head` at boot so a
      # fresh `compose up` comes up read-write. Prod leaves this OFF (explicit
      # migrate step); the entrypoint also refuses it when APP_ENV=production.
      OC_MIGRATE_ON_BOOT: ${OC_MIGRATE_ON_BOOT:-true}
      # Runtime role (created by migration 0001) — least privilege.
      DATABASE_URL: postgresql+asyncpg://oc_app:${OC_APP_PASSWORD:-oc_app_pw}@db:5432/${POSTGRES_DB:-office_connect}
      # Owner role — Alembic + privileged test fixtures only.
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oc_dev}:${POSTGRES_PASSWORD:-oc_dev_pw}@db:5432/${POSTGRES_DB:-office_connect}
      OC_APP_PASSWORD: ${OC_APP_PASSWORD:-oc_app_pw}
      REDIS_URL: redis://redis:6379/0
      BASE_URL: ${BASE_URL:-http://localhost:8001}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      # Storage driver (Increment 3): local content-addressed volume store.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /app/storage
      # Attachments scan (Increment 4): empty CLAMAV_HOST -> NullScanner (dev
      # fail-safe = clean; prod = error/deny). Set CLAMAV_HOST=clamav and run the
      # `clamav` compose profile to scan for real.
      ATTACHMENT_SCANNER: ${ATTACHMENT_SCANNER:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # The running app enqueues notification dispatch to the worker (after
      # commit). CLI/tests keep the 'inline' default (no worker needed).
      NOTIFICATIONS_DISPATCH: ${NOTIFICATIONS_DISPATCH:-celery}
      # Observability (Increment 4): JSON logs + fail-safe optional error tracker.
      LOG_JSON: ${LOG_JSON:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8001:8001"          # host 8001 -> avoids Laravel `php artisan serve` (8000)
    volumes:
      - ./office_connect:/app/office_connect   # live reload during dev
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
      - ./tests:/app/tests
      - ./backups:/app/backups                 # dumps land on the host (3-2-1 local leg)
      - ./storage:/app/storage                 # local-volume attachments store

  # Celery worker — runs the nightly pg_dump backup task (Increment 2). Carries
  # the OWNER DSN (oc_dev) so pg_dump/pg_restore can dump/restore the full DB.
  # OC_MIGRATE_ON_BOOT is intentionally UNSET here — only the app migrates in dev.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://oc_app:${OC_APP_PASSWORD:-oc_app_pw}@db:5432/${POSTGRES_DB:-office_connect}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oc_dev}:${POSTGRES_PASSWORD:-oc_dev_pw}@db:5432/${POSTGRES_DB:-office_connect}
      OC_APP_PASSWORD: ${OC_APP_PASSWORD:-oc_app_pw}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /app/storage
      ATTACHMENT_SCANNER: ${ATTACHMENT_SCANNER:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      LOG_JSON: ${LOG_JSON:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
    command: celery -A office_connect.worker.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./office_connect:/app/office_connect
      - ./backups:/app/backups
      - ./storage:/app/storage

  # Celery beat — SINGLE scheduler instance. Never scale this service and never
  # embed `--beat` on a scaled worker: two schedulers = duplicate backups.
  # Only needs Redis (it enqueues tasks by name; the worker does the DB work).
  beat:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      REDIS_URL: redis://redis:6379/0
    command: celery -A office_connect.worker.celery_app beat --loglevel=info --schedule /var/run/celery/celerybeat-schedule
    volumes:
      - ./office_connect:/app/office_connect
      - beatdata:/var/run/celery

  # ClamAV daemon for the attachments scan pipeline (Increment 4). Opt-in via the
  # `clamav` profile — the default stack + CI use the fail-closed NullScanner, so
  # they skip ClamAV's ~1 GB signature DB + warm-up. Internal network only (no
  # published port); prod publishes only 443. Enable with:
  #   CLAMAV_HOST=clamav docker compose --profile clamav up -d
  clamav:
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    restart: unless-stopped
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s      # first boot downloads/loads the signature DB
    volumes:
      - clamdb:/var/lib/clamav

  # Self-hosted error tracker (GlitchTip, Sentry-SDK compatible) — opt-in via the
  # `observability` profile; NOT in the default stack. Fail-safe: the app/worker
  # only emit events when SENTRY_DSN is set (to a project DSN created in the
  # GlitchTip UI). Full production hardening (managed PG/Redis, mail, retention,
  # TLS) is a Stage-C/deploy task; this is the dev-wiring skeleton. Enable with:
  #   docker compose --profile observability up -d
  glitchtip-db:
    image: postgres:16-alpine
    profiles: ["observability"]
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip}
    volumes:
      - glitchtip_pg:/var/lib/postgresql/data

  glitchtip:
    image: glitchtip/glitchtip:v4.0
    profiles: ["observability"]
    depends_on:
      glitchtip-db:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-db:5432/glitchtip
      REDIS_URL: redis://redis:6379/3       # separate Redis DB from app/broker/results
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-change-me-min-32-bytes-secret}
      PORT: "8080"
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8080}
      EMAIL_URL: consolemail://
      DEFAULT_FROM_EMAIL: glitchtip@localhost
    ports:
      - "8080:8080"          # dev only; prod fronts it behind the reverse proxy

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.0
    profiles: ["observability"]
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-db:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-db:5432/glitchtip
      REDIS_URL: redis://redis:6379/3
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-change-me-min-32-bytes-secret}

volumes:
  pgdata:
  beatdata:
  clamdb:
  glitchtip_pg:
